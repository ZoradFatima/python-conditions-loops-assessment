<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>
  <rect width="1000" height="260" fill="url(#bgGrad)" rx="12" />
  
  <circle cx="900" cy="50" r="80" fill="#3b82f6" opacity="0.1" />
  <circle cx="100" cy="220" r="100" fill="#10b981" opacity="0.08" />

  <text x="60" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" fill="#ffffff">Python Conditions &amp; Loops Assessment</text>
  <text x="60" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">University Scholarship Eligibility System &amp; Smart Pharmacy Inventory Management</text>

  <g transform="translate(60, 135)">
    <rect x="0" y="0" width="140" height="30" rx="6" fill="url(#badgeGrad)" />
    <text x="70" y="20" font-family="sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Conditional Logic</text>

    <rect x="155" y="0" width="120" height="30" rx="6" fill="#10b981" opacity="0.2" />
    <text x="215" y="20" font-family="sans-serif" font-size="12" font-weight="600" fill="#34d399" text-anchor="middle">For Loops</text>

    <rect x="285" y="0" width="130" height="30" rx="6" fill="#f59e0b" opacity="0.2" />
    <text x="350" y="20" font-family="sans-serif" font-size="12" font-weight="600" fill="#fbbf24" text-anchor="middle">Input Validation</text>
  </g>

  <g transform="translate(620, 45)" opacity="0.95">
    <rect width="330" height="175" rx="8" fill="#090d16" stroke="#334155" stroke-width="1.5" />
    <circle cx="20" cy="18" r="5" fill="#ef4444" />
    <circle cx="35" cy="18" r="5" fill="#f59e0b" />
    <circle cx="50" cy="18" r="5" fill="#10b981" />
    <text x="70" y="22" font-family="monospace" font-size="11" fill="#64748b">main_system.py</text>
    <line x1="15" y1="32" x2="315" y2="32" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="55" font-family="monospace" font-size="12" fill="#38bdf8">if marks &gt;= 90:</text>
    <text x="35" y="75" font-family="monospace" font-size="12" fill="#a7f3d0">print("Full Scholarship")</text>
    <text x="20" y="100" font-family="monospace" font-size="12" fill="#38bdf8">for med in inventory:</text>
    <text x="35" y="120" font-family="monospace" font-size="12" fill="#a7f3d0">revenue += med.sales</text>
    <text x="35" y="140" font-family="monospace" font-size="12" fill="#f43f5e">if med.stock &lt; 10: restock++</text>
  </g>
</svg>