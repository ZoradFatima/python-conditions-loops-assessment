<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="100%" height="100%">
  <rect width="800" height="620" fill="#ffffff" />
  
  <text x="400" y="35" font-family="sans-serif" font-size="18" font-weight="700" fill="#1e293b" text-anchor="middle">Pharmacy Inventory System - Program Flow</text>

  <rect x="330" y="55" width="140" height="40" rx="20" fill="#10b981" />
  <text x="400" y="80" font-family="sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Start Program</text>
  <line x1="400" y1="95" x2="400" y2="125" stroke="#64748b" stroke-width="2" />

  <polygon points="300,125 500,125 480,170 280,170" fill="#d1fae5" stroke="#10b981" stroke-width="2" />
  <text x="390" y="154" font-family="sans-serif" font-size="13" font-weight="600" fill="#065f46" text-anchor="middle">Input Number of Medicines (N)</text>
  <line x1="400" y1="170" x2="400" y2="200" stroke="#64748b" stroke-width="2" />

  <rect x="310" y="200" width="180" height="45" rx="6" fill="#e0f2fe" stroke="#3b82f6" stroke-width="2" />
  <text x="400" y="228" font-family="sans-serif" font-size="13" font-weight="600" fill="#0369a1" text-anchor="middle">For i in range(1, N+1)</text>
  <line x1="400" y1="245" x2="400" y2="280" stroke="#64748b" stroke-width="2" />

  <polygon points="300,280 500,280 480,330 280,330" fill="#e0f2fe" stroke="#3b82f6" stroke-width="2" />
  <text x="390" y="312" font-family="sans-serif" font-size="13" font-weight="600" fill="#0369a1" text-anchor="middle">Input Name, Stock, Price, Qty Sold</text>
  <line x1="400" y1="330" x2="400" y2="365" stroke="#64748b" stroke-width="2" />

  <polygon points="400,365 520,405 400,445 280,405" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
  <text x="400" y="410" font-family="sans-serif" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">Qty Sold &lt;= Stock?</text>
  <line x1="400" y1="445" x2="400" y2="485" stroke="#16a34a" stroke-width="2" />
  <text x="415" y="470" font-family="sans-serif" font-size="11" fill="#16a34a">Valid</text>

  <rect x="300" y="485" width="200" height="45" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="2" />
  <text x="400" y="513" font-family="sans-serif" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">Calculate Revenue &amp; Restock</text>
  <line x1="400" y1="530" x2="400" y2="565" stroke="#64748b" stroke-width="2" />

  <rect x="300" y="565" width="200" height="40" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="2" />
  <text x="400" y="590" font-family="sans-serif" font-size="12" font-weight="600" fill="#065f46" text-anchor="middle">Generate Final Revenue Report</text>
</svg>