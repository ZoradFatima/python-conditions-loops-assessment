<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#ffffff" />
  
  <text x="400" y="35" font-family="sans-serif" font-size="18" font-weight="700" fill="#1e293b" text-anchor="middle">Student Scholarship System - Program Flow</text>

  <rect x="330" y="60" width="140" height="40" rx="20" fill="#3b82f6" />
  <text x="400" y="85" font-family="sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Start Program</text>
  <line x1="400" y1="100" x2="400" y2="130" stroke="#64748b" stroke-width="2" />

  <polygon points="300,130 500,130 480,180 280,180" fill="#e0f2fe" stroke="#3b82f6" stroke-width="2" />
  <text x="390" y="162" font-family="sans-serif" font-size="13" font-weight="600" fill="#0369a1" text-anchor="middle">Collect &amp; Validate Inputs</text>
  <line x1="400" y1="180" x2="400" y2="210" stroke="#64748b" stroke-width="2" />

  <polygon points="400,210 500,250 400,290 300,250" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
  <text x="400" y="255" font-family="sans-serif" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">Marks &gt;= 80?</text>
  <line x1="500" y1="250" x2="570" y2="250" stroke="#dc2626" stroke-width="2" />
  <text x="535" y="242" font-family="sans-serif" font-size="11" fill="#dc2626">No</text>
  <line x1="400" y1="290" x2="400" y2="330" stroke="#16a34a" stroke-width="2" />
  <text x="415" y="315" font-family="sans-serif" font-size="11" fill="#16a34a">Yes</text>

  <polygon points="400,330 500,370 400,410 300,370" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
  <text x="400" y="375" font-family="sans-serif" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">Attendance &gt;= 85?</text>
  <line x1="500" y1="370" x2="570" y2="370" stroke="#dc2626" stroke-width="2" />
  <text x="535" y="362" font-family="sans-serif" font-size="11" fill="#dc2626">No</text>
  <line x1="400" y1="410" x2="400" y2="450" stroke="#16a34a" stroke-width="2" />
  <text x="415" y="435" font-family="sans-serif" font-size="11" fill="#16a34a">Yes</text>

  <polygon points="400,450 500,490 400,530 300,490" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
  <text x="400" y="495" font-family="sans-serif" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">Income &lt;= 50k?</text>
  <line x1="500" y1="490" x2="570" y2="490" stroke="#dc2626" stroke-width="2" />
  <text x="535" y="482" font-family="sans-serif" font-size="11" fill="#dc2626">No</text>
  <line x1="400" y1="530" x2="400" y2="560" stroke="#16a34a" stroke-width="2" />
  <text x="415" y="550" font-family="sans-serif" font-size="11" fill="#16a34a">Yes</text>

  <rect x="570" y="340" width="180" height="50" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2" />
  <text x="660" y="370" font-family="sans-serif" font-size="12" font-weight="600" fill="#991b1b" text-anchor="middle">Ineligible (Record Reasons)</text>

  <rect x="310" y="560" width="180" height="35" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="2" />
  <text x="400" y="583" font-family="sans-serif" font-size="12" font-weight="600" fill="#065f46" text-anchor="middle">Full / Partial Scholarship</text>
</svg>