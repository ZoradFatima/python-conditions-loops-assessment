<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="100%" height="100%">
  <rect width="1000" height="380" fill="#ffffff" rx="8" />
  
  <g transform="translate(40, 30)">
    <rect width="430" height="320" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
    <rect width="430" height="50" rx="10" fill="#3b82f6" />
    <text x="25" y="32" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff">Task 1: Scholarship System</text>
    
    <text x="25" y="80" font-family="sans-serif" font-size="13" font-weight="600" fill="#475569">File Name:</text>
    <text x="160" y="80" font-family="monospace" font-size="13" fill="#1e293b">student_scholarship_system.py</text>
    
    <text x="25" y="115" font-family="sans-serif" font-size="13" font-weight="600" fill="#475569">Primary Topic:</text>
    <text x="160" y="115" font-family="sans-serif" font-size="13" fill="#1e293b">Conditional Statements (if, elif, else)</text>
    
    <text x="25" y="150" font-family="sans-serif" font-size="13" font-weight="600" fill="#475569">Inputs:</text>
    <text x="160" y="150" font-family="sans-serif" font-size="13" fill="#1e293b">Name, Marks (%), Attendance (%), Income</text>
    
    <text x="25" y="185" font-family="sans-serif" font-size="13" font-weight="600" fill="#475569">Core Rules:</text>
    <text x="160" y="185" font-family="sans-serif" font-size="13" fill="#1e293b">Marks &gt;= 80, Attendance &gt;= 85,</text>
    <text x="160" y="205" font-family="sans-serif" font-size="13" fill="#1e293b">Income &lt;= Rs. 50,000</text>
    
    <text x="25" y="240" font-family="sans-serif" font-size="13" font-weight="600" fill="#475569">Output:</text>
    <text x="160" y="240" font-family="sans-serif" font-size="13" fill="#1e293b">Scholarship Status / Ineligibility Reasons</text>

    <text x="25" y="280" font-family="sans-serif" font-size="12" font-weight="600" fill="#3b82f6">Techniques: Try-Except, Nested Conditions</text>
  </g>

  <g transform="translate(530, 30)">
    <rect width="430" height="320" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
    <rect width="430" height="50" rx="10" fill="#10b981" />
    <text x="25" y="32" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff">Task 2: Pharmacy Inventory</text>
    
    <text x="25" y="80" font-family="sans-serif" font-size="13" font-weight="600" fill="#475569">File Name:</text>
    <text x="160" y="80" font-family="monospace" font-size="13" fill="#1e293b">pharmacy_inventory_system.py</text>
    
    <text x="25" y="115" font-family="sans-serif" font-size="13" font-weight="600" fill="#475569">Primary Topic:</text>
    <text x="160" y="115" font-family="sans-serif" font-size="13" fill="#1e293b">Loop Structures (for loop, range)</text>
    
    <text x="25" y="150" font-family="sans-serif" font-size="13" font-weight="600" fill="#475569">Inputs:</text>
    <text x="160" y="150" font-family="sans-serif" font-size="13" fill="#1e293b">Name, Stock, Price, Quantity Sold</text>
    
    <text x="25" y="185" font-family="sans-serif" font-size="13" font-weight="600" fill="#475569">Core Rules:</text>
    <text x="160" y="185" font-family="sans-serif" font-size="13" fill="#1e293b">Stock Check, Remaining Stock,</text>
    <text x="160" y="205" font-family="sans-serif" font-size="13" fill="#1e293b">Low Stock Alert (&lt; 10 units)</text>
    
    <text x="25" y="240" font-family="sans-serif" font-size="13" font-weight="600" fill="#475569">Output:</text>
    <text x="160" y="240" font-family="sans-serif" font-size="13" fill="#1e293b">Revenue, Restock Count, Final Report</text>

    <text x="25" y="280" font-family="sans-serif" font-size="12" font-weight="600" fill="#10b981">Techniques: Accumulators, Counters, Lists</text>
  </g>
</svg>