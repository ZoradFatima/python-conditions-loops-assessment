<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <rect width="900" height="480" fill="#ffffff" rx="8" />
  
  <text x="450" y="35" font-family="sans-serif" font-size="18" font-weight="700" fill="#1e293b" text-anchor="middle">Module Architecture &amp; Function Call Diagram</text>

  <g transform="translate(50, 70)">
    <rect width="360" height="360" rx="8" fill="#f8fafc" stroke="#3b82f6" stroke-width="2" />
    <rect width="360" height="45" rx="8" fill="#3b82f6" />
    <text x="180" y="28" font-family="sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">student_scholarship_system.py</text>
    
    <text x="20" y="75" font-family="monospace" font-size="13" font-weight="600" fill="#1e293b">get_valid_string(prompt)</text>
    <text x="35" y="95" font-family="sans-serif" font-size="12" fill="#64748b">- Validates non-empty text input</text>
    
    <text x="20" y="135" font-family="monospace" font-size="13" font-weight="600" fill="#1e293b">get_valid_float(prompt, min, max)</text>
    <text x="35" y="155" font-family="sans-serif" font-size="12" fill="#64748b">- Handles range and ValueError</text>
    
    <text x="20" y="195" font-family="monospace" font-size="13" font-weight="600" fill="#1e293b">evaluate_scholarship()</text>
    <text x="35" y="215" font-family="sans-serif" font-size="12" fill="#64748b">- Collects parameters &amp; checks rules</text>
    <text x="35" y="235" font-family="sans-serif" font-size="12" fill="#64748b">- Prints structured evaluation report</text>
    
    <rect x="20" y="270" width="320" height="60" rx="6" fill="#e0f2fe" />
    <text x="180" y="295" font-family="sans-serif" font-size="12" font-weight="600" fill="#0369a1" text-anchor="middle">Rules: Marks &gt;= 80, Att &gt;= 85,</text>
    <text x="180" y="315" font-family="sans-serif" font-size="12" font-weight="600" fill="#0369a1" text-anchor="middle">Income &lt;= 50,000</text>
  </g>

  <g transform="translate(490, 70)">
    <rect width="360" height="360" rx="8" fill="#f8fafc" stroke="#10b981" stroke-width="2" />
    <rect width="360" height="45" rx="8" fill="#10b981" />
    <text x="180" y="28" font-family="sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">pharmacy_inventory_system.py</text>
    
    <text x="20" y="75" font-family="monospace" font-size="13" font-weight="600" fill="#1e293b">get_valid_int(prompt, min)</text>
    <text x="35" y="95" font-family="sans-serif" font-size="12" fill="#64748b">- Validates integer stock/quantities</text>
    
    <text x="20" y="135" font-family="monospace" font-size="13" font-weight="600" fill="#1e293b">get_valid_float(prompt, min)</text>
    <text x="35" y="155" font-family="sans-serif" font-size="12" fill="#64748b">- Validates unit prices</text>
    
    <text x="20" y="195" font-family="monospace" font-size="13" font-weight="600" fill="#1e293b">run_pharmacy_system()</text>
    <text x="35" y="215" font-family="sans-serif" font-size="12" fill="#64748b">- Executes for-loop over medicines</text>
    <text x="35" y="235" font-family="sans-serif" font-size="12" fill="#64748b">- Updates revenue &amp; restock counters</text>
    
    <rect x="20" y="270" width="320" height="60" rx="6" fill="#d1fae5" />
    <text x="180" y="295" font-family="sans-serif" font-size="12" font-weight="600" fill="#065f46" text-anchor="middle">Accumulator: Revenue</text>
    <text x="180" y="315" font-family="sans-serif" font-size="12" font-weight="600" fill="#065f46" text-anchor="middle">Counter: Low stock (&lt; 10 units)</text>
  </g>
</svg>